<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schorzen Project</title>
<style>
  :root { --bg:#0e1216; --ink:#e9efe6; --muted:#8d9a93; --accent:#c8ff3d; --panel:#171d23; --edge:#28323b; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink);
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:max(14px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom)); }
  header { text-align:center; margin:6px 0 12px; }
  h1 { margin:0; font-size:clamp(1.8rem,6vw,3rem); font-weight:700; letter-spacing:.02em; }
  #author { margin:4px 0 0; color:var(--muted); }
  #stage { position:relative; width:100%; max-width:920px; aspect-ratio:4/3; background:#000;
    border:1px solid var(--edge); border-radius:14px; overflow:hidden; }
  video, canvas { position:absolute; inset:0; width:100%; height:100%; }
  #stage.mirror video, #stage.mirror #fx { transform:scaleX(-1); }
  #fx { display:none; image-rendering:auto; }
  #stage.fxon #fx { display:block; }
  #stage.fxon video { opacity:0; }
  #stage.sticks #fx { opacity:0; }
  .lab { color:var(--muted); font-size:.85rem; display:flex; gap:6px; align-items:center; }
  #stage.sticks video { opacity:0; }
  #overlay { position:absolute; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:12px; text-align:center; padding:20px; background:var(--panel); }
  #overlay p { margin:0; color:var(--muted); max-width:34ch; line-height:1.45; }
  #hud { position:absolute; left:10px; top:10px; z-index:2; display:flex; gap:6px; flex-wrap:wrap; }
  .chip { background:rgba(10,14,18,.72); border:1px solid var(--edge); border-radius:20px;
    padding:4px 11px; font-size:.82rem; }
  button { font:inherit; font-weight:700; border:0; border-radius:10px; cursor:pointer;
    padding:11px 20px; background:var(--accent); color:#14200a; }
  button.alt { background:#26313a; color:var(--ink); padding:9px 14px; font-weight:600; }
  button.alt[aria-pressed="true"] { background:#3b4a2a; outline:1px solid var(--accent); }
  button:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  #bar { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; width:100%; max-width:920px; margin-top:12px; }
  #chat { width:100%; max-width:920px; margin-top:12px; background:var(--panel); border:1px solid var(--edge); border-radius:14px; padding:12px; }
  #chatTop { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  #chatTop b { margin-right:auto; }
  #chat select, #chat input[type=text] { font:inherit; background:#0e1216; color:var(--ink); border:1px solid var(--edge); border-radius:8px; padding:8px 10px; }
  #aiProg { color:var(--muted); font-size:.8rem; margin:8px 0; min-height:1.1em; word-break:break-word; }
  #chatLog { height:190px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
  .msg { max-width:85%; padding:8px 11px; border-radius:12px; line-height:1.4; font-size:.95rem; white-space:pre-wrap; }
  .msg.me { align-self:flex-end; background:#2d3b1f; }
  .msg.ai { align-self:flex-start; background:#222c34; }
  #chatRow { display:flex; gap:8px; } #chatIn { flex:1; }
  footer { margin-top:auto; padding-top:16px; color:var(--muted); font-size:.82rem; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>Schorzen Project</h1>
  <p id="author"></p>
</header>

<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="fx"></canvas>
  <canvas id="canvas"></canvas>
  <div id="hud" hidden><span class="chip" id="cHuman">0 humans</span><span class="chip" id="cAnimal">0 animals</span><span class="chip" id="cFps">0 fps</span><span class="chip" id="cSay" hidden></span></div>
  <div id="overlay">
    <p id="msg">Point your camera at people or animals. They are drawn as stick figures instead of boxes.</p>
    <button id="start">Open camera</button>
  </div>
</div>

<div id="bar" hidden>
  <button class="alt" id="flip">Switch camera</button>
  <button class="alt" id="sticksBtn" aria-pressed="false">Sticks only</button>
  <button class="alt" id="pauseBtn" aria-pressed="false">Pause</button>
  <button class="alt" id="fxBtn">Effect: Normal</button>
  <button class="alt" id="chatBtn">AI chat</button>
  <button class="alt" id="talkBtn">Talk</button>
  <button class="alt" id="narrBtn" aria-pressed="false">Auto-narrate</button>
  <button class="alt" id="snap">Save photo</button>
  <label class="lab">Strength <input type="range" id="fxStr" min="1" max="9" value="5"></label>
</div>
<section id="chat" hidden>
  <div id="chatTop">
    <b>On-device AI chat</b>
    <select id="aiModel" aria-label="AI model">
      <option value="Llama-3.2-1B-Instruct">Smarter (Llama 1B, ~0.9 GB)</option>
      <option value="Qwen2.5-0.5B-Instruct">Smaller (Qwen 0.5B, ~0.4 GB)</option>
    </select>
    <button class="alt" id="aiLoad">Load AI</button>
    <label class="lab"><input type="checkbox" id="speakChk" checked> Speak</label>
  </div>
  <div id="aiProg">First load downloads the model once, then it is saved on your device.</div>
  <div id="chatLog"></div>
  <div id="chatRow"><input type="text" id="chatIn" placeholder="Ask anything…" autocomplete="off"><button id="chatSend">Send</button></div>
</section>
<footer>Runs fully in your browser. No video leaves your device.</footer>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
// ---- Change your name here ----
const AUTHOR = "Your Name";
function $(id){ return document.getElementById(id); }
$("author").textContent = AUTHOR;

const video=$("video"), canvas=$("canvas"), ctx=canvas.getContext("2d"), stage=$("stage");
const ANIMALS = new Set(["bird","cat","dog","horse","sheep","cow","elephant","bear","zebra","giraffe"]);
let facing="environment", stream=null, poseNet=null, objNet=null, pairs=[];
let running=false, paused=false, frame=0, lastT=performance.now(), fps=0;
const humanSmooth = new Map();   // id -> {kp:[{x,y,s}], seen}
let tracks = [], nextTrack = 1;  // animal tracks
const mirror = () => stage.classList.contains("mirror");

/* ---------- camera ---------- */
async function startCamera(){
  if (stream) stream.getTracks().forEach(t=>t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode:facing, width:{ideal:960}, height:{ideal:720} }, audio:false });
  video.srcObject = stream; await video.play();
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  stage.style.aspectRatio = video.videoWidth+" / "+video.videoHeight;
  stage.classList.toggle("mirror", facing==="user");
  humanSmooth.clear(); tracks=[];
}
async function loadModels(){
  await tf.ready();
  poseNet = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,
    { modelType: poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING, enableTracking:true });
  pairs = poseDetection.util.getAdjacentPairs(poseDetection.SupportedModels.MoveNet);
  objNet = await cocoSsd.load({ base:"mobilenet_v2" });
}

$("start").onclick = async () => {
  const b=$("start"); b.disabled=true; b.textContent="Starting camera…";
  try {
    facing = /Mobi|Android/i.test(navigator.userAgent) ? "environment" : "user";
    await startCamera();
    b.textContent="Loading models…";
    await loadModels();
    $("overlay").style.display="none"; $("hud").hidden=false; $("bar").hidden=false;
    if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(()=>{});
    running=true; loop();
  } catch(e){
    console.error(e);
    b.disabled=false; b.textContent="Try again";
    $("msg").textContent = "Could not start. Allow camera access and open this page over https.";
  }
};
$("flip").onclick = async()=>{ facing = facing==="user"?"environment":"user"; try{ await startCamera(); }catch(e){console.error(e);} };
$("sticksBtn").onclick = e=>{ const on=stage.classList.toggle("sticks"); e.target.setAttribute("aria-pressed",on); };
$("pauseBtn").onclick = e=>{ paused=!paused; e.target.setAttribute("aria-pressed",paused); e.target.textContent=paused?"Resume":"Pause"; paused?video.pause():video.play(); };
$("snap").onclick = ()=>{
  const c=document.createElement("canvas"); c.width=canvas.width; c.height=canvas.height;
  const g=c.getContext("2d"); g.fillStyle="#000"; g.fillRect(0,0,c.width,c.height);
  if(!stage.classList.contains("sticks")){
    g.save(); if(mirror()){ g.translate(c.width,0); g.scale(-1,1); }
    g.drawImage(fxMode?fx:video,0,0,c.width,c.height); g.restore();
  }
  g.drawImage(canvas,0,0);
  g.fillStyle="rgba(255,255,255,.85)"; g.font="bold "+Math.round(c.width/38)+"px sans-serif";
  g.fillText("Schorzen Project — "+AUTHOR, 14, c.height-16);
  const a=document.createElement("a"); a.download="schorzen-"+Date.now()+".png"; a.href=c.toDataURL("image/png"); a.click();
};

/* ---------- drawing helpers (mirror handled in canvas, so text stays readable) ---------- */
const W=()=>canvas.width, mx = x => mirror()? W()-x : x;
function style(color,w){ ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=w; ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.shadowColor=color; ctx.shadowBlur=w*2.5; }
function seg(x1,y1,x2,y2){ ctx.beginPath(); ctx.moveTo(mx(x1),y1); ctx.lineTo(mx(x2),y2); ctx.stroke(); }
function poly(pts){ ctx.beginPath(); pts.forEach((p,i)=> i?ctx.lineTo(mx(p[0]),p[1]):ctx.moveTo(mx(p[0]),p[1])); ctx.stroke(); }
function circ(x,y,r,fill){ ctx.beginPath(); ctx.arc(mx(x),y,r,0,Math.PI*2); fill?ctx.fill():ctx.stroke(); }
function label(t,x,y,color){ ctx.save(); ctx.shadowBlur=0; ctx.fillStyle=color;
  ctx.font="bold "+Math.max(13,W()/48)+"px sans-serif"; ctx.textAlign="center"; ctx.fillText(t,mx(x),y); ctx.restore(); }

/* ---------- humans ---------- */
function smoothHuman(p,idx){
  const id = p.id ?? ("i"+idx);
  let s = humanSmooth.get(id);
  if(!s){ s={kp:p.keypoints.map(k=>({x:k.x,y:k.y,s:k.score})),seen:0}; humanSmooth.set(id,s); }
  p.keypoints.forEach((k,i)=>{ const o=s.kp[i], a=0.6; o.x+=(k.x-o.x)*a; o.y+=(k.y-o.y)*a; o.s=k.score; });
  s.seen=frame; s.id=id; return s;
}
function drawHuman(s){
  const k=s.kp, ok=i=>k[i].s>0.3;
  const hue = (typeof s.id==="number" ? s.id*67 : 90) % 360;
  const color = "hsl("+(hue+80)%360+",100%,62%)";
  const lw = Math.max(3,W()/190);
  style(color,lw);
  for(const [a,b] of pairs) if(ok(a)&&ok(b)) seg(k[a].x,k[a].y,k[b].x,k[b].y);
  if(ok(5)&&ok(6)&&ok(11)&&ok(12))
    seg((k[5].x+k[6].x)/2,(k[5].y+k[6].y)/2,(k[11].x+k[12].x)/2,(k[11].y+k[12].y)/2);
  if(ok(0)){
    let r=W()/45;
    if(ok(3)&&ok(4)) r=Math.hypot(k[3].x-k[4].x,k[3].y-k[4].y)*0.85;
    else if(ok(5)&&ok(6)) r=Math.hypot(k[5].x-k[6].x,k[5].y-k[6].y)*0.28;
    const cy = k[0].y - r*0.15;
    circ(k[0].x,cy,Math.max(r,10),false);
    if(ok(5)&&ok(6)) seg(k[0].x,cy+Math.max(r,10),(k[5].x+k[6].x)/2,(k[5].y+k[6].y)/2); // neck
  }
  [9,10,15,16].forEach(i=>{ if(ok(i)) circ(k[i].x,k[i].y,lw*1.3,true); });
  if(ok(0)) label("human",k[0].x,k[0].y-W()/14,color);
}

/* ---------- animals: tracking + stick skeleton ---------- */
const PROFILE = { // b=body height ratio, n=neck reach, h=head height ratio, hr=head radius, legs, ear, tail
  dog:{b:.5,n:.22,h:.2,hr:.07,ear:1,tail:.12}, cat:{b:.55,n:.16,h:.22,hr:.08,ear:2,tail:.3},
  horse:{b:.42,n:.2,h:.1,hr:.06,ear:1,tail:.2}, cow:{b:.42,n:.18,h:.3,hr:.07,ear:1,tail:.15},
  sheep:{b:.45,n:.15,h:.3,hr:.07,ear:1,tail:.06}, zebra:{b:.42,n:.2,h:.12,hr:.06,ear:1,tail:.18},
  bear:{b:.45,n:.17,h:.25,hr:.08,ear:1,tail:.04}, elephant:{b:.4,n:.2,h:.28,hr:.1,ear:0,tail:.12,trunk:1},
  giraffe:{b:.5,n:.08,h:.04,hr:.04,ear:1,tail:.1}, bird:{b:.5,n:.14,h:.28,hr:.1,ear:0,tail:.2,bird:1}
};
function iou(a,b){ const x1=Math.max(a[0],b[0]),y1=Math.max(a[1],b[1]),x2=Math.min(a[0]+a[2],b[0]+b[2]),y2=Math.min(a[1]+a[3],b[1]+b[3]);
  const i=Math.max(0,x2-x1)*Math.max(0,y2-y1); return i/(a[2]*a[3]+b[2]*b[3]-i+1e-6); }
function updateTracks(dets){
  const used=new Set();
  for(const t of tracks){
    let best=null,bs=0.15;
    dets.forEach((d,i)=>{ if(used.has(i)||d.class!==t.cls) return; const s=iou(t.box,d.bbox); if(s>bs){bs=s;best=i;} });
    if(best===null){ t.miss++; continue; }
    used.add(best); const d=dets[best].bbox, a=0.55;
    const ocx=t.box[0]+t.box[2]/2;
    for(let i=0;i<4;i++) t.box[i]+=(d[i]-t.box[i])*a;
    const dx=(t.box[0]+t.box[2]/2)-ocx; t.vx=t.vx*0.7+dx*0.3; t.miss=0; t.hits++;
    if(Math.abs(t.vx)>1.2) t.dir = t.vx>0?1:-1;
  }
  dets.forEach((d,i)=>{ if(!used.has(i)) tracks.push({id:nextTrack++,cls:d.class,box:[...d.bbox],vx:0,dir:1,hits:1,miss:0,phase:Math.random()*6}); });
  tracks = tracks.filter(t=>t.miss<4);
}
function drawAnimal(t,now){
  const [x,y,w,h]=t.box, P=PROFILE[t.cls], f=t.dir, lw=Math.max(3,W()/190);
  const color="#ff9a3d"; style(color,lw);
  const by=y+h*P.b, rear=f>0?x+w*.14:x+w*.86, front=f>0?x+w*.72:x+w*.28;
  const moving=Math.abs(t.vx)>1.2, sw=moving?Math.sin(now/110+t.phase)*w*.05:0;
  // spine with slight arch
  poly([[rear,by+h*.02],[(rear+front)/2,by-h*.03],[front,by]]);
  // neck + head
  const hx=front+f*w*P.n, hy=y+h*P.h+P.hr*h;
  seg(front,by,hx,hy);
  const r=Math.max(7,Math.min(w,h)*P.hr*1.2);
  circ(hx,hy,r,false);
  if(P.ear){ seg(hx,hy-r,hx-f*r*.3,hy-r*1.9); if(P.ear===2) seg(hx+f*r*.5,hy-r*.8,hx+f*r*.8,hy-r*1.7); }
  if(P.trunk) poly([[hx+f*r,hy+r*.3],[hx+f*r*1.5,hy+r*2],[hx+f*r*.8,hy+r*3.4]]);
  // tail
  seg(rear,by+h*.02,rear-f*w*.1,by-h*P.tail);
  const foot=y+h;
  if(P.bird){
    poly([[(rear+front)/2,by],[(rear+front)/2+sw,foot]]);
    poly([[(rear+front)/2-f*w*.05,by],[(rear+front)/2-f*w*.05-sw,foot]]);
    poly([[rear+f*w*.1,by-h*.02],[rear-f*w*.1,by-h*.3]]); // wing
  } else {
    const legs=[[front,sw],[front-f*w*.08,-sw],[rear,-sw],[rear+f*w*.08,sw]];
    for(const [lx,s] of legs){ const kx=lx+s*.5, ky=(by+foot)/2;
      poly([[lx,by],[kx-f*w*.02,ky],[lx+s,foot]]); circ(lx+s,foot,lw*.9,true); }
  }
  [[rear,by+h*.02],[front,by]].forEach(p=>circ(p[0],p[1],lw*1.2,true));
  label(t.cls,x+w/2,Math.max(16,y-8),color);
}

/* ---------- camera effects: real processing of the live camera pixels ---------- */
const fx=$("fx"), fctx=fx.getContext("2d",{willReadFrequently:true}), FW=320;
const FXNAMES=["Normal","Night vision","Thermal view","Motion trails","Motion detect","Edges"];
let fxMode=0, fxStr=5, fxBg=null, fxEcho=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const PAL=(()=>{ const st=[[0,0,0,20],[.25,80,0,120],[.5,200,30,60],[.75,255,160,0],[1,255,255,200]], p=new Uint8Array(768);
  for(let i=0;i<256;i++){ const t=i/255; let k=1; while(k<st.length-1&&t>st[k][0]) k++;
    const a=st[k-1], b=st[k], f=(t-a[0])/(b[0]-a[0]);
    for(let c=0;c<3;c++) p[i*3+c]=a[c+1]+(b[c+1]-a[c+1])*f; }
  return p; })();

$("fxBtn").onclick = e=>{ fxMode=(fxMode+1)%FXNAMES.length; fxBg=null; fxEcho=null;
  e.target.textContent="Effect: "+FXNAMES[fxMode]; stage.classList.toggle("fxon",fxMode>0); };
$("fxStr").oninput = e=>{ fxStr=+e.target.value; };

function fxStep(){
  if(!fxMode||video.readyState<2||!video.videoWidth) return;
  const H=Math.round(FW*video.videoHeight/video.videoWidth);
  if(fx.width!==FW||fx.height!==H){ fx.width=FW; fx.height=H; fxBg=null; fxEcho=null; }
  fctx.drawImage(video,0,0,FW,H);
  const im=fctx.getImageData(0,0,FW,H), d=im.data, n=FW*H, lum=new Float32Array(n);
  let mean=0, lo=255, hi=0;
  for(let i=0;i<n;i++){ const v=.3*d[i*4]+.59*d[i*4+1]+.11*d[i*4+2]; lum[i]=v; mean+=v; if(v<lo)lo=v; if(v>hi)hi=v; }
  mean/=n;
  if(fxMode===1){            // night vision: adaptive gain, amplified sensor noise, green phosphor tint
    const gain=clamp(130/(mean+8),1,7)*(.6+fxStr*.1), nz=18+gain*7;
    for(let i=0;i<n;i++){ const v=clamp(lum[i]*gain+(Math.random()-.5)*nz,0,255), o=i*4;
      d[o]=v*.12; d[o+1]=v; d[o+2]=v*.22; }
  } else if(fxMode===2){     // thermal-style false color from brightness (not real heat)
    const r=Math.max(20,hi-lo);
    for(let i=0;i<n;i++){ const k=clamp(((lum[i]-lo)/r)*255,0,255)|0, o=i*4;
      d[o]=PAL[k*3]; d[o+1]=PAL[k*3+1]; d[o+2]=PAL[k*3+2]; }
  } else if(fxMode===3){     // motion trails: temporal echo of previous frames
    if(!fxEcho){ fxEcho=new Float32Array(n*3); for(let i=0;i<n;i++) for(let c=0;c<3;c++) fxEcho[i*3+c]=d[i*4+c]; }
    const dec=.7+fxStr*.025;
    for(let i=0;i<n;i++) for(let c=0;c<3;c++){ const k=i*3+c, v=d[i*4+c];
      fxEcho[k]=fxEcho[k]*dec+v*(1-dec); d[i*4+c]=clamp(v*.45+fxEcho[k]*.7,0,255); }
  } else if(fxMode===4){     // motion detect: difference from a slow background model, shown in color
    if(!fxBg) fxBg=lum.slice();
    const sc=.6+fxStr*.35;
    for(let i=0;i<n;i++){ const df=Math.abs(lum[i]-fxBg[i]); fxBg[i]+=(lum[i]-fxBg[i])*.08;
      const k=clamp(df*sc*4,0,255)|0, o=i*4, g=lum[i]*.35;
      d[o]=clamp(g+PAL[k*3],0,255); d[o+1]=clamp(g+PAL[k*3+1],0,255); d[o+2]=clamp(g+PAL[k*3+2],0,255); }
  } else {                   // edges: Sobel filter
    const s=.4+fxStr*.25;
    for(let y=1;y<H-1;y++) for(let x=1;x<FW-1;x++){ const i=y*FW+x;
      const gx=-lum[i-FW-1]-2*lum[i-1]-lum[i+FW-1]+lum[i-FW+1]+2*lum[i+1]+lum[i+FW+1];
      const gy=-lum[i-FW-1]-2*lum[i-FW]-lum[i-FW+1]+lum[i+FW-1]+2*lum[i+FW]+lum[i+FW+1];
      const v=clamp(Math.hypot(gx,gy)*s,0,255), o=i*4; d[o]=v*.3; d[o+1]=v; d[o+2]=v; }
  }
  fctx.putImageData(im,0,0);
}

/* ---------- voice: talk to the camera (rule-based, runs in the page) ---------- */
const scene={humans:0,animals:[]};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function say(t){ $("cSay").hidden=false; $("cSay").textContent="\u{1F5E3} "+t;
  if(!("speechSynthesis" in window)||window.noSpeak) return;
  speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(t)); }
function describe(){
  const parts=[], c={};
  if(scene.humans) parts.push(scene.humans+(scene.humans===1?" person":" people"));
  scene.animals.forEach(n=>c[n]=(c[n]||0)+1);
  for(const n in c) parts.push(c[n]+" "+(c[n]>1&&n!=="sheep"?n+"s":n));
  return parts.length?"I see "+parts.join(" and ")+".":"I don't see any people or animals right now.";
}
function setFx(name){ let k=0; while(FXNAMES[fxMode].toLowerCase()!==name&&k++<8) $("fxBtn").click(); }
function answer(q){
  q=q.toLowerCase();
  if(/night/.test(q)){ setFx("night vision"); return "Night vision is on."; }
  if(/thermal|heat/.test(q)){ setFx("thermal view"); return "Thermal view is on. It is false color, not real heat."; }
  if(/trail/.test(q)){ setFx("motion trails"); return "Motion trails are on."; }
  if(/motion/.test(q)){ setFx("motion detect"); return "Motion detection is on."; }
  if(/edge/.test(q)){ setFx("edges"); return "Edges are on."; }
  if(/normal|no effect|turn off|reset/.test(q)){ setFx("normal"); return "Back to the normal view."; }
  if(/stick/.test(q)&&/only/.test(q)){ $("sticksBtn").click(); return "Toggled sticks only."; }
  if(/photo|picture|snap|save/.test(q)){ $("snap").click(); return "Saving a photo."; }
  if(/switch|flip|front|rear|other camera/.test(q)){ $("flip").click(); return "Switching camera."; }
  if(/how many/.test(q)&&/(people|person|human)/.test(q)) return "I see "+scene.humans+(scene.humans===1?" person.":" people.");
  if(/how many/.test(q)&&/animal/.test(q)) return "I see "+scene.animals.length+(scene.animals.length===1?" animal.":" animals.");
  if(/ghost|spirit|ghosts/.test(q)) return "I can't detect ghosts. I only recognize people and animals.";
  if(/who are you|your name|hello|^hi\b|hey/.test(q)) return "I'm the Schorzen Project camera assistant, made by "+AUTHOR+". I run on your device.";
  if(/see|look|what|describe|around|there/.test(q)) return describe();
  return null;
}
function handleQuery(q){
  window.chatAdd&&window.chatAdd("me",q);
  const a=answer(q);
  if(a!==null){ window.chatAdd&&window.chatAdd("ai",a); say(a); }
  else if(window.aiReady) window.askAI(q);
  else { const m="I can describe what I see, change effects, switch camera or save a photo. Open AI chat and tap Load AI to ask me anything."; window.chatAdd&&window.chatAdd("ai",m); say(m); }
}
$("talkBtn").onclick=()=>{
  if(!SR){ const q=prompt("Voice input isn't supported in this browser. Type your question:"); if(q) handleQuery(q); return; }
  const r=new SR(); r.lang="en-US"; r.interimResults=false; $("talkBtn").textContent="Listening\u2026";
  r.onresult=e=>{ const q=e.results[0][0].transcript; $("cSay").hidden=false; $("cSay").textContent="\u{1F3A4} "+q; setTimeout(()=>handleQuery(q),700); };
  r.onerror=e=>say(e.error==="not-allowed"?"Microphone permission was blocked.":"Sorry, I didn't catch that.");
  r.onend=()=>{ $("talkBtn").textContent="Talk"; };
  r.start();
};
let narrOn=false, lastSig="", lastSpoke=0;
$("narrBtn").onclick=e=>{ narrOn=!narrOn; e.target.setAttribute("aria-pressed",narrOn); lastSig=""; if(narrOn) say("Auto narration on."); };
setInterval(()=>{ if(!narrOn) return; const sig=describe();
  if(sig!==lastSig&&!/don't see/.test(sig)&&Date.now()-lastSpoke>5000){ lastSig=sig; lastSpoke=Date.now(); say(sig); }
  else if(/don't see/.test(sig)) lastSig=sig; },1500);

/* ---------- main loop ---------- */
async function loop(){
  if(!running) return;
  const now=performance.now();
  if(!paused && video.readyState>=2){
    fxStep();
    try{
      const poses = await poseNet.estimatePoses(video,{maxPoses:6,flipHorizontal:false});
      if(frame%3===0){ const o=await objNet.detect(video,12,0.45); updateTracks(o.filter(d=>ANIMALS.has(d.class))); }
      frame++;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const people=poses.filter(p=>(p.score??1)>0.2).map(smoothHuman);
      people.forEach(drawHuman);
      for(const [id,s] of humanSmooth) if(frame-s.seen>8) humanSmooth.delete(id);
      const vis=tracks.filter(t=>t.hits>=2&&t.miss<2);
      scene.humans=people.length; scene.animals=vis.map(t=>t.cls);
      vis.forEach(t=>drawAnimal(t,now));
      $("cHuman").textContent=people.length+(people.length===1?" human":" humans");
      $("cAnimal").textContent=vis.length+(vis.length===1?" animal":" animals");
    }catch(e){ console.error(e); }
  }
  fps = fps*0.9 + (1000/Math.max(1,now-lastT))*0.1; lastT=now;
  $("cFps").textContent=Math.round(fps)+" fps";
  requestAnimationFrame(loop);
}
</script>
<script type="module">
import * as webllm from "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm";
const $=id=>document.getElementById(id);
let engine=null, busy=false; const hist=[]; window.aiReady=false; window.noSpeak=false;
function add(role,text){ const d=document.createElement("div"); d.className="msg "+role; d.textContent=text; $("chatLog").appendChild(d); $("chatLog").scrollTop=1e9; return d; }
window.chatAdd=add;
$("chatBtn").onclick=()=>{ $("chat").hidden=!$("chat").hidden; };
$("speakChk").onchange=e=>{ window.noSpeak=!e.target.checked; if(window.noSpeak) speechSynthesis.cancel(); };
$("aiLoad").onclick=async()=>{
  if(!navigator.gpu){ $("aiProg").textContent="This browser has no WebGPU. Try Chrome on a recent phone or computer."; return; }
  $("aiLoad").disabled=true; $("aiProg").textContent="Starting…";
  try{
    let f16=false; try{ const ad=await navigator.gpu.requestAdapter(); f16=!!(ad&&ad.features.has("shader-f16")); }catch(e){}
    const id=$("aiModel").value+(f16?"-q4f16_1-MLC":"-q4f32_1-MLC");
    engine=await webllm.CreateMLCEngine(id,{initProgressCallback:r=>{ $("aiProg").textContent=r.text; }});
    window.aiReady=true; $("aiProg").textContent="AI ready. It runs on your device. Small models can make mistakes.";
    add("ai","Hi! I run fully on your device. Ask me anything, or tap Talk.");
  }catch(e){ console.error(e); $("aiProg").textContent="Could not load the AI: "+(e.message||e); $("aiLoad").disabled=false; }
};
window.askAI=async q=>{
  if(!engine||busy) return; busy=true; const out=add("ai","…");
  const sys="You are the Schorzen Project camera assistant, made by "+AUTHOR+". You run on the user's phone. Answer in 1 to 3 short sentences. Right now the camera view: "+describe()+" Only mention the camera if the user asks about it.";
  let text="";
  try{
    const chunks=await engine.chat.completions.create({messages:[{role:"system",content:sys},...hist.slice(-6),{role:"user",content:q}],stream:true,max_tokens:220,temperature:.7});
    for await(const c of chunks){ text+=(c.choices[0]&&c.choices[0].delta.content)||""; out.textContent=text; $("chatLog").scrollTop=1e9; }
  }catch(e){ console.error(e); text="Sorry, something went wrong."; out.textContent=text; }
  hist.push({role:"user",content:q},{role:"assistant",content:text}); busy=false; say(text);
};
function send(){ const q=$("chatIn").value.trim(); if(!q) return; $("chatIn").value=""; handleQuery(q); }
$("chatSend").onclick=send; $("chatIn").onkeydown=e=>{ if(e.key==="Enter") send(); };
</script>
